server {
    listen 80;
    server_name 10.109.119.208;

    # ── 前端静态文件 ─────────────────────────────────────────
    root /home/szh/system/frontend;
    index login.html;

    location / {
        try_files $uri $uri/ /login.html;
    }

    # ── 上传文件服务 ─────────────────────────────────────────
    location /uploads/ {
        alias /home/szh/system/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API 反向代理 → Flask :5000 ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        # CORS（如直接访问 5000 端口时由 Flask 处理；经 nginx 代理不需要）
        # 上传文件大小限制
        client_max_body_size 20M;
        proxy_read_timeout   120s;
    }

    # ── 日志 ─────────────────────────────────────────────────
    access_log /var/log/nginx/c3f_access.log;
    error_log  /var/log/nginx/c3f_error.log;
}
