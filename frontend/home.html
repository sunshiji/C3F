<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 文种识别系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
           background:#f0f7ff; color:#1e293b; }
    .stat-card {
      background:#fff; border-radius:1.25rem; padding:1.5rem;
      box-shadow:0 2px 12px rgba(0,0,0,.06); border:1.5px solid #f1f5f9;
      display:flex; align-items:center; gap:1.25rem; transition:transform .2s;
    }
    .stat-card:hover { transform:translateY(-2px); }
    .stat-icon {
      width:56px; height:56px; border-radius:1rem;
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; flex-shrink:0;
    }
    .card { background:#fff; border-radius:1.25rem; padding:1.5rem;
            box-shadow:0 2px 12px rgba(0,0,0,.06); border:1.5px solid #f1f5f9; }
    .badge {
      display:inline-block; padding:.2rem .65rem; border-radius:9999px;
      font-size:.7rem; font-weight:600;
    }
  </style>
</head>
<body class="p-6">

  <!-- 欢迎栏 -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-3">
    <div>
      <h2 class="text-xl font-bold text-gray-800">
        <i class="fas fa-sun text-amber-400 mr-2"></i>欢迎回来，<span id="welcomeName">用户</span>！
      </h2>
      <p class="text-sm text-gray-400 mt-1">今天是 <span id="todayStr"></span>，共有 <span id="totalToday" class="text-blue-600 font-semibold">-</span> 条识别记录</p>
    </div>
    <a href="upload.html"
       onclick="if(window.parent!==window){window.parent.loadPage(null,'upload.html');return false;}"
       class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition">
      <i class="fas fa-plus"></i>新建识别
    </a>
  </div>

  <!-- 统计卡片 -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="stat-card">
      <div class="stat-icon bg-blue-50"><i class="fas fa-images text-blue-500"></i></div>
      <div>
        <div class="text-2xl font-bold text-gray-800" id="statTotal">-</div>
        <div class="text-xs text-gray-400 mt-0.5">累计识别次数</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-green-50"><i class="fas fa-calendar-day text-green-500"></i></div>
      <div>
        <div class="text-2xl font-bold text-gray-800" id="statToday">-</div>
        <div class="text-xs text-gray-400 mt-0.5">今日识别次数</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-violet-50"><i class="fas fa-language text-violet-500"></i></div>
      <div>
        <div class="text-2xl font-bold text-gray-800" id="statLangs">-</div>
        <div class="text-xs text-gray-400 mt-0.5">识别语种数量</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-amber-50"><i class="fas fa-check-circle text-amber-500"></i></div>
      <div>
        <div class="text-2xl font-bold text-gray-800">OCR</div>
        <div class="text-xs text-gray-400 mt-0.5">多语种识别引擎</div>
      </div>
    </div>
  </div>

  <!-- 图表区 -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

    <!-- 折线图：近7天趋势 -->
    <div class="card md:col-span-2">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-700"><i class="fas fa-chart-line text-blue-400 mr-2"></i>近7天识别趋势</h3>
      </div>
      <canvas id="trendChart" height="100"></canvas>
    </div>

    <!-- 饼图：语种分布 -->
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-700"><i class="fas fa-chart-pie text-violet-400 mr-2"></i>语种分布</h3>
      </div>
      <canvas id="distChart" height="200"></canvas>
      <div id="distLegend" class="mt-3 space-y-1 text-xs"></div>
    </div>
  </div>

  <!-- 最近记录 -->
  <div class="card">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-semibold text-gray-700"><i class="fas fa-clock-rotate-left text-green-400 mr-2"></i>最近识别记录</h3>
      <a href="history.html"
         onclick="if(window.parent!==window){window.parent.loadPage(null,'history.html');return false;}"
         class="text-xs text-blue-500 hover:underline">查看全部 <i class="fas fa-chevron-right text-xs"></i></a>
    </div>
    <div id="recentList">
      <div class="text-center text-gray-400 py-8 text-sm">
        <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>加载中...
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    // 鉴权
    const user = JSON.parse(localStorage.getItem('c3f_user') || 'null');
    if (!user) { localStorage.removeItem('c3f_user'); window.top.location.href = 'login.html'; }
    document.getElementById('welcomeName').textContent = user?.username || '用户';
    document.getElementById('todayStr').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'});

    const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#84cc16'];

    async function loadStats() {
      try {
        const res = await fetch(`${API}/api/stats`, { credentials:'include' });
        if (res.status === 401) { localStorage.removeItem('c3f_user'); window.top.location.href = 'login.html'; return; }
        const d = await res.json();

        document.getElementById('statTotal').textContent = d.total ?? '-';
        document.getElementById('statToday').textContent = d.today ?? '-';
        document.getElementById('statLangs').textContent = d.langs ?? '-';
        document.getElementById('totalToday').textContent = `${d.today ?? 0} 条`;

        // 折线图
        const week  = d.week || [];
        const days  = week.map(r => r.day.slice(5));  // MM-DD
        const cnts  = week.map(r => r.cnt);
        new Chart(document.getElementById('trendChart'), {
          type: 'line',
          data: {
            labels: days,
            datasets: [{
              label: '识别次数', data: cnts,
              borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.08)',
              borderWidth: 2.5, fill: true,
              tension: 0.4, pointRadius: 4, pointBackgroundColor: '#3b82f6',
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color:'#f1f5f9' } },
              x: { grid: { display: false } }
            }
          }
        });

        // 饼图
        const dist  = d.dist || [];
        const dLabels = dist.map(r => r.language_name || '未知');
        const dCnts   = dist.map(r => r.cnt);
        new Chart(document.getElementById('distChart'), {
          type: 'doughnut',
          data: {
            labels: dLabels,
            datasets: [{ data: dCnts, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }]
          },
          options: {
            responsive: true, cutout: '60%',
            plugins: { legend: { display: false } }
          }
        });
        // 图例
        const legend = document.getElementById('distLegend');
        legend.innerHTML = dLabels.map((l,i) =>
          `<div class="flex items-center gap-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full" style="background:${COLORS[i%COLORS.length]}"></span>
            <span class="text-gray-600">${l}</span>
            <span class="ml-auto font-semibold text-gray-700">${dCnts[i]}</span>
          </div>`
        ).join('');

        // 最近记录
        const recent = d.recent || [];
        const langColors = { zh:'bg-red-100 text-red-700', en:'bg-blue-100 text-blue-700',
          ja:'bg-pink-100 text-pink-700', ko:'bg-purple-100 text-purple-700',
          ar:'bg-green-100 text-green-700', fr:'bg-sky-100 text-sky-700',
          de:'bg-orange-100 text-orange-700', es:'bg-yellow-100 text-yellow-700',
          ru:'bg-indigo-100 text-indigo-700' };
        const recentHtml = recent.length === 0
          ? `<div class="text-center text-gray-400 py-8 text-sm"><i class="fas fa-inbox text-2xl mb-2 block"></i>暂无记录</div>`
          : `<div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-gray-400 text-xs border-b border-gray-100">
                    <th class="pb-2 text-left font-medium">文件名</th>
                    <th class="pb-2 text-left font-medium">识别语种</th>
                    <th class="pb-2 text-left font-medium">置信度</th>
                    <th class="pb-2 text-left font-medium">时间</th>
                    <th class="pb-2 text-left font-medium">操作人</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                  ${recent.map(r => {
                    const lc = (r.detected_language || '').toLowerCase();
                    const cls = langColors[lc] || 'bg-gray-100 text-gray-700';
                    const conf = r.confidence ? `${r.confidence.toFixed(1)}%` : '-';
                    return `<tr class="hover:bg-gray-50 transition">
                      <td class="py-2.5 pr-4 truncate max-w-[160px]">${r.original_filename || '-'}</td>
                      <td class="py-2.5 pr-4"><span class="badge ${cls}">${r.language_name || '-'}</span></td>
                      <td class="py-2.5 pr-4 text-gray-500">${conf}</td>
                      <td class="py-2.5 pr-4 text-gray-400">${(r.created_at||'').slice(0,16)}</td>
                      <td class="py-2.5 text-gray-400">${r.username||'-'}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>`;
        document.getElementById('recentList').innerHTML = recentHtml;

      } catch(e) {
        document.getElementById('recentList').innerHTML =
          `<div class="text-center text-red-400 py-6 text-sm"><i class="fas fa-circle-exclamation mr-1"></i>加载失败，请刷新页面</div>`;
      }
    }

    loadStats();
  </script>
</body>
</html>
